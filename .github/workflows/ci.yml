name: DiffScope CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Type-check, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            app/static/hello-world/package-lock.json

      - name: Install Forge backend dependencies
        working-directory: app
        run: npm ci

      - name: Type-check Forge backend
        working-directory: app
        run: npm run typecheck

      - name: Install Custom UI dependencies
        working-directory: app/static/hello-world
        run: npm ci

      - name: Run Custom UI and domain tests
        working-directory: app/static/hello-world
        run: npm test

      - name: Build Custom UI
        working-directory: app/static/hello-world
        run: npm run build

      - name: Disable Forge CLI usage analytics prompt
        working-directory: app
        run: npx --yes @forge/cli@15.0.0 settings set usage-analytics false

      - name: Lint Forge manifest
        working-directory: app
        run: npx --yes @forge/cli@15.0.0 lint
